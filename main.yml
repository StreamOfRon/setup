- name: Workstation setup
  hosts: all
  gather_facts: true
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  vars_files:
    - default.config.yml

  pre_tasks:
    - name: Check for local options file
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/.setup-options"
      register: local_options_file

    - name: Include local configuration
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'HOME') }}/.setup-options"
      when: local_options_file.stat.exists

    - name: Update package managers
      block:
        - name: Update homebrew packages
          community.general.homebrew:
            update_homebrew: true
          when: ansible_facts.pkg_mgr == "homebrew"

    - name: Get list of installed packages
      block:
        - name: Get installed homebrew packages
          ansible.builtin.import_tasks: tasks/homebrew_list.yml
          when: ansible_facts.pkg_mgr == "homebrew"

  tasks:
    - name: Install setup-config command
      ansible.builtin.import_tasks: tasks/setup-config.yml

    - name: Configure hostname sanity check
      ansible.builtin.import_tasks: tasks/hostname.yml
      when: hostname_sanity_check | default(true)

    - name: Configure ansible-pull cron jobs
      ansible.builtin.import_tasks: tasks/ansible-pull-cron.yml
      when: setup_ansible_pull
    - name: Install dotfiles
      ansible.builtin.import_tasks: tasks/dotfiles.yml
      when: dotfiles
    - name: Install Oh My Zsh
      ansible.builtin.import_tasks: tasks/oh-my-zsh.yml
      when: oh_my_zsh
    - name: Set up agent Python environment
      ansible.builtin.import_tasks: tasks/agent_python.yml
      when: agent_python | default(true)
    - name: Configure VSCode
      ansible.builtin.import_tasks: tasks/vscode.yml
      when: vscode
    - name: Manage Mac App Store apps
      ansible.builtin.import_tasks: tasks/mac-app-store.yml
      when: mac_app_store
    - name: Manage sync tools
      block:
        - name: Manage sync tools packages
          ansible.builtin.import_tasks: tasks/homebrew_packages.yml
          vars:
            enabled: "{{ install_sync_tools | default(false) }}"
            groupname: sync
            formulae: "{{ sync_formulae }}"
            casks: "{{ sync_casks }}"
          when:
            - ansible_facts.pkg_mgr == "homebrew"
      rescue:
        - name: Warn about sync tools install failure
          ansible.builtin.debug:
            msg: "Failed to manage sync tools, continuing: {{ ansible_failed_result | default('unknown error') }}"

    - name: Manage misc apps
      block:
        - name: Manage misc apps packages
          ansible.builtin.import_tasks: tasks/homebrew_packages.yml
          vars:
            enabled: "{{ install_misc_apps | default(false) }}"
            groupname: misc
            formulae: "{{ misc_formulae }}"
            casks: "{{ misc_casks }}"
          when:
            - ansible_facts.pkg_mgr == "homebrew"
      rescue:
        - name: Warn about misc apps install failure
          ansible.builtin.debug:
            msg: "Failed to manage misc apps, continuing: {{ ansible_failed_result | default('unknown error') }}"

    - name: Manage entertainment apps
      block:
        - name: Manage entertainment apps packages
          ansible.builtin.import_tasks: tasks/homebrew_packages.yml
          vars:
            enabled: "{{ install_entertainment_apps | default(false) }}"
            groupname: entertainment
            formulae: "{{ entertainment_formulae }}"
