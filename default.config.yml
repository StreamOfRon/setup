# Group toggles accept three values:
#   true  - install all apps in the group
#   false - remove all apps in the group
#   ignore - skip the group entirely
hostname_sanity_check: true
setup_ansible_pull: true
dotfiles: true
oh_my_zsh: true
agent_python: true
agent_python_venv: "{{ lookup('env', 'HOME') }}/.local/share/default-venv"
agent_python_packages:
  - pyyaml

vscode: false

install_apple_office: false
install_garageband: false
install_imovie: false
mac_app_store: false

install_mas_apps:
  - 1352778147 # Bitwarden
remove_mas_apps: []

install_sync_tools: false
sync_formulae: []
sync_casks:
  - nextcloud
  - syncthing
sync_apt_packages:
  - nextcloud-desktop
  - syncthing

install_misc_apps: false
misc_formulae: []
misc_casks:
  - iterm2
  - the-unarchiver
misc_apt_packages:
  - unar

install_entertainment_apps: false
entertainment_formulae: []
entertainment_casks:
  - spotify
  - vlc
entertainment_apt_packages:
  - vlc

install_media_tools: false
media_formulae: []
media_casks:
  - handbrake
  - makemkv
media_apt_packages:
  - handbrake

install_kube_apps: false
kube_taps: []
kube_formulae:
  - argocd
  - kubernetes-cli
  - kubectx
kube_casks:
  - freelens
  - podman-desktop
kube_apt_packages:
  - kubectl
  - kubectx

install_dev_cli_tools: false
dev_cli_formulae:
  - ansible-lint
  - gh
  - pre-commit
  - yq
dev_cli_casks: []
dev_cli_apt_packages:
  - ansible-lint
  - gh
  - pre-commit
  - yq

install_dev_gui_tools: false
dev_gui_formulae: []
dev_gui_casks:
  - font-fira-code
  - font-fira-code-nerd-font
  - zed
dev_gui_apt_packages:
  - fonts-firacode

install_ai_dev_tools: false
ai_dev_tools_formulae:
  - worktrunk
  - fzf
  - node
ai_dev_tools_casks: []
ai_dev_tools_apt_packages:
  - fzf
  - nodejs
  - npm

install_common_cli_tools: false
common_cli_formulae:
  - zstd
common_cli_casks: []
common_cli_apt_packages:
  - zstd

install_aws_tools: false
aws_formulae:
  - awscli
  - s3cmd
aws_casks: []
aws_apt_packages:
  - awscli
  - s3cmd

install_ghostty: false
ghostty_install_method: apt

install_other_apps: true
install_other_formulae: []
install_other_casks: []
install_other_apt_packages: []
remove_other_formulae: []
remove_other_casks: []
