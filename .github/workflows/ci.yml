name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and ansible-lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core>=2.19,<2.21" "ansible-lint>=25,<27"
          ansible-galaxy collection install -r requirements.yml

      - name: Playbook syntax check
        run: ansible-playbook --syntax-check -i localhost, main.yml

      - name: Lint
        run: ansible-lint

      - name: Unit and task-file tests
        run: python3 -m unittest tests.test_setup_config tests.test_playbook -v
