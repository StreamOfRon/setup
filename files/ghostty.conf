# Ghostty configuration
# Managed by Ansible workstation setup playbook

# Terminal type — ensures SSH compatibility
term=xterm-256color

# Font
font-family=FiraCode Nerd Font

# Appearance: no theme is set so Ghostty follows the system light/dark
# appearance. Ghostty has no built-in theme named "dark".

# Window padding
window-padding-x=10
window-padding-y=10

# Shell integration (for zsh)
shell-integration=zsh

# Cursor
cursor-style=block

# Transparency
background-opacity=0.90

# Background blur
{% if ansible_facts.system == 'Darwin' %}
background-blur=macos-glass-regular
{% else %}
background-blur=true
{% endif %}

link-url=true

# Enable OSC 8 hyperlinks emitted by applications (e.g. Claude Code, OpenCode)
# so file paths and URLs are clickable with Cmd+click.
link-osc8=true

# Disable mouse reporting so terminal applications cannot capture mouse clicks.
# This keeps Cmd+click link opening working even in fullscreen TUIs (e.g.
# Claude Code/OpenCode) where mouse reporting would otherwise swallow it.
mouse-reporting=false

# Copy selected text to the system clipboard automatically
copy-on-select=clipboard
