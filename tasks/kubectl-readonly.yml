# Install kubectl-readonly via krew. Krew and kubernetes-cli are managed by the
# Kubernetes package group; this task only installs the plugins themselves.
# Krew's binaries live in ~/.krew/bin, which is added to PATH by the zshrc
# template when that directory exists.
#
# When Homebrew is not available, krew itself is installed first via tasks/krew.yml.
- name: Determine whether kubectl-readonly should be managed
  ansible.builtin.set_fact:
    krew_readonly_selected: "{{ (install_kube_apps | default(false)) == true }}"
    krew_readonly_unselected: "{{ (install_kube_apps | default(false)) == false }}"

- name: Ensure krew is installed
  ansible.builtin.import_tasks: tasks/krew.yml

- name: Check for kubectl binary
  ansible.builtin.command: which kubectl
  register: kubectl_binary
  changed_when: false
  failed_when: false
  when: krew_readonly_selected

- name: Install the krew (self) plugin
  ansible.builtin.command: kubectl krew install krew
  args:
    creates: "{{ lookup('env', 'HOME') }}/.krew/bin/kubectl-krew"
  environment:
    PATH: "{{ lookup('env', 'HOME') }}/.krew/bin:{{ ansible_env.PATH | default(lookup('env', 'PATH')) }}"
  changed_when: false
  when:
    - krew_readonly_selected
    - kubectl_binary.rc | default(1) == 0

- name: Install the readonly plugin
  ansible.builtin.command: kubectl krew install readonly
  args:
    creates: "{{ lookup('env', 'HOME') }}/.krew/bin/kubectl-readonly"
  environment:
    PATH: "{{ lookup('env', 'HOME') }}/.krew/bin:{{ ansible_env.PATH | default(lookup('env', 'PATH')) }}"
  changed_when: false
  when:
    - krew_readonly_selected
    - kubectl_binary.rc | default(1) == 0

- name: Uninstall the readonly plugin
  ansible.builtin.command: kubectl krew uninstall readonly
  environment:
    PATH: "{{ lookup('env', 'HOME') }}/.krew/bin:{{ ansible_env.PATH | default(lookup('env', 'PATH')) }}"
  failed_when: false
  changed_when: false
  when:
    - krew_readonly_unselected
    - kubectl_binary.rc | default(1) == 0
