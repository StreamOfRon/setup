# uv is installed as a prerequisite by main.yml (tasks/uv.yml).
- name: Create default venv with uv
  ansible.builtin.command:
    cmd: "{{ lookup('env', 'HOME') }}/.local/bin/uv venv {{ agent_python_venv }} --seed"
    creates: "{{ agent_python_venv }}/bin/python"

- name: Install common python packages into default venv
  ansible.builtin.command:
    cmd: "{{ lookup('env', 'HOME') }}/.local/bin/uv pip install --python {{ agent_python_venv }}/bin/python {{ agent_python_packages | join(' ') }}"
  register: agent_python_pip
  changed_when: >-
    'Installed' in agent_python_pip.stdout or
    'Installed' in agent_python_pip.stderr or
    'Updated' in agent_python_pip.stdout or
    'Updated' in agent_python_pip.stderr
  when: agent_python_packages | length > 0

- name: Verify plain import works in default venv
  ansible.builtin.command:
    cmd: "{{ agent_python_venv }}/bin/python -c \"import yaml; print(yaml.__version__)\""
  changed_when: false
