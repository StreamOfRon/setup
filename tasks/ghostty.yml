# Ghostty terminal emulator install and configuration.
#
# Three-valued group semantics:
#   true   - install and manage everything below
#   false  - remove what this group installed
#   ignore - skip the group entirely, leave everything as-is
#
# Install and removal are gated by the group itself. Configuration is gated
# only by the group being ON: on a first apply the binary may not exist yet at
# the time this file starts, and a missing binary is no reason to skip writing
# a config file that the install puts in place moments later.

# --- true: install and manage ---

- name: Install ghostty via Homebrew (macOS)
  community.general.homebrew_cask:
    name: ghostty
    state: present
    sudo_password: "{{ ansible_become_password | default(omit) }}"
  when:
    - ansible_facts.pkg_mgr == "homebrew"
    - install_ghostty | default(false) == true
    - "'ghostty' not in (installed_brew_casks.stdout_lines | default([]))"

- name: Install ghostty via apt (Ubuntu/Debian)
  ansible.builtin.apt:
    name: ghostty
    state: present
  become: true
  when:
    - ansible_facts.pkg_mgr == "apt"
    - install_ghostty | default(false) == true
    - ghostty_install_method | default('apt') == 'apt'
    - ansible_become_password is defined
    - "'ghostty' not in (installed_apt_packages.stdout_lines | default([]))"

- name: Install ghostty via AppImage (Ubuntu/Debian)
  when:
    - ansible_facts.pkg_mgr == "apt"
    - install_ghostty | default(false) == true
    - ghostty_install_method | default('apt') == 'appimage'
  block:
    - name: Determine architecture for AppImage
      ansible.builtin.set_fact:
        ghostty_arch: "{{ 'aarch64' if ansible_facts.machine == 'aarch64' else 'x86_64' }}"
      when:
        - ansible_facts.machine is defined

    - name: Ensure ~/Applications directory exists
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/Applications"
        state: directory
        mode: "0755"

    - name: Download ghostty AppImage
      ansible.builtin.get_url:
        url: "https://github.com/pkgforge-dev/ghostty-appimage/releases/latest/download/ghostty-{{ ghostty_arch }}.AppImage"
        dest: "{{ lookup('env', 'HOME') }}/Applications/ghostty.AppImage"
        mode: "0755"

    - name: Ensure symlink to ghostty AppImage in ~/.local/bin
      ansible.builtin.file:
        src: "{{ lookup('env', 'HOME') }}/Applications/ghostty.AppImage"
        dest: "{{ lookup('env', 'HOME') }}/.local/bin/ghostty"
        state: link

- name: Ensure Ghostty config directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.config/ghostty"
    state: directory
    mode: "0755"
  when: install_ghostty | default(false) == true

- name: Install Ghostty configuration
  ansible.builtin.copy:
    src: files/ghostty.conf
    dest: "{{ lookup('env', 'HOME') }}/.config/ghostty/ghostty.conf"
    mode: "0644"
  when: install_ghostty | default(false) == true

# --- false: remove what this group installed ---

- name: Remove managed Ghostty config
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.config/ghostty/ghostty.conf"
    state: absent
  when: install_ghostty | default(false) == false

- name: Remove symlink to ghostty AppImage
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin/ghostty"
    state: absent
  when:
    - install_ghostty | default(false) == false
    - ansible_facts.pkg_mgr == "apt"

- name: Remove ghostty AppImage
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/Applications/ghostty.AppImage"
    state: absent
  when:
    - install_ghostty | default(false) == false
    - ansible_facts.pkg_mgr == "apt"

- name: Remove ghostty via Homebrew (macOS)
  community.general.homebrew_cask:
    name: ghostty
    state: absent
    sudo_password: "{{ ansible_become_password | default(omit) }}"
  when:
    - ansible_facts.pkg_mgr == "homebrew"
    - install_ghostty | default(false) == false
    - "'ghostty' in (installed_brew_casks.stdout_lines | default([]))"

- name: Remove ghostty via apt (Ubuntu/Debian)
  ansible.builtin.apt:
    name: ghostty
    state: absent
  become: true
  when:
    - ansible_facts.pkg_mgr == "apt"
    - install_ghostty | default(false) == false
    - ghostty_install_method | default('apt') == 'apt'
    - ansible_become_password is defined
    - "'ghostty' in (installed_apt_packages.stdout_lines | default([]))"
