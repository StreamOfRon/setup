- name: Disable cron email
  ansible.builtin.cron:
    name: MAILTO
    env: true
    job: ""

- name: Setup cron PATH
  ansible.builtin.cron:
    name: PATH
    env: true
    job: "/opt/homebrew/bin:/opt/homebrew/sbin:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin"

# The script itself decides full re-apply vs quiet sync from the age of
# ~/.ansible.last-full-apply, so no flags are needed at the cron level.
- name: Ansible-pull cron job
  ansible.builtin.cron:
    name: ansible-pull quarter-hourly
    minute: "*/15"
    job: "{{ lookup('env', 'HOME') }}/.setup/run-ansible-pull.sh >{{ lookup('env', 'HOME') }}/.ansible.log 2>&1"

- name: Ansible-pull reboot cron
  ansible.builtin.cron:
    name: ansible-pull reboot
    special_time: reboot
    job: "{{ lookup('env', 'HOME') }}/.setup/run-ansible-pull.sh >{{ lookup('env', 'HOME') }}/.ansible.log 2>&1"

# One-time cleanup: removes the pre-catch-up daily entry, which pointed at
# run-daily-apply.sh. Safe to delete this task once no machine's crontab
# contains an "ansible daily re-apply" line anymore.
- name: Remove legacy daily re-apply cron
  ansible.builtin.cron:
    name: ansible daily re-apply
    state: absent
