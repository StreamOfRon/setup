- name: Homebrew taps for {{ groupname }}
  community.general.homebrew_tap:
    name: "{{ taps }}"
    path: "{{ brew_bin_dir }}"
    state: '{{ enabled | ternary("present", "absent") }}'
  when:
    - taps is defined
    - taps | length > 0
    - taps | difference(brew_taps.stdout_lines) | length > 0 or
      (taps | intersect(brew_taps.stdout_lines) | length > 0 and not enabled)
    - enabled != "ignore"

- name: Homebrew formulae for {{ groupname }}
  community.general.homebrew:
    name: "{{ formulae }}"
    path: "{{ brew_bin_dir }}"
    state: '{{ enabled | ternary("latest", "absent") }}'
  when:
    - formulae | length > 0
    - formulae | difference(installed_brew_formulae.stdout_lines) | length > 0 or
      (formulae | intersect(installed_brew_formulae.stdout_lines) | length > 0 and not enabled)
    - enabled != "ignore"

- name: Homebrew casks for {{ groupname }}
  community.general.homebrew_cask:
    name: "{{ casks }}"
    path: "{{ brew_bin_dir }}"
    state: '{{ enabled | ternary("present", "absent") }}'
    sudo_password: "{{ ansible_become_password | default() }}"
  when:
    - ansible_facts.system == "Darwin"
    - casks | length > 0
    - casks | difference(installed_brew_casks.stdout_lines) | length > 0 or
      (casks | intersect(installed_brew_casks.stdout_lines) | length > 0 and not enabled)
    - enabled != "ignore"
