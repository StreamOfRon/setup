- name: Ensure omp config directory
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.omp/agent"
    state: directory

- name: Manage omp config.yml
  ansible.builtin.template:
    src: templates/omp-config.yml.j2
    dest: "{{ lookup('env', 'HOME') }}/.omp/agent/config.yml"
    mode: "0600"

- name: Manage omp models.yml
  ansible.builtin.template:
    src: templates/omp-models.yml.j2
    dest: "{{ lookup('env', 'HOME') }}/.omp/agent/models.yml"
    mode: "0644"
