- name: Ensure opencode config directory
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.config/opencode"
    state: directory
    mode: "0755"

- name: Ensure opencode plugins directory
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.config/opencode/plugins"
    state: directory
    mode: "0755"

- name: Manage opencode.json
  ansible.builtin.template:
    src: templates/opencode.json.j2
    dest: "{{ lookup('env', 'HOME') }}/.config/opencode/opencode.json"
    mode: "0644"

- name: Remove legacy provider-queue plugin file
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.config/opencode/plugins/provider-queue.js"
    state: absent

- name: Manage opencode cli.json
  ansible.builtin.template:
    src: templates/opencode-cli.json.j2
    dest: "{{ lookup('env', 'HOME') }}/.config/opencode/cli.json"
    mode: "0600"
